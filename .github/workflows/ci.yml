name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "DESD.LifeHub.slnx"

      - name: Build
        run: dotnet build "DESD.LifeHub.slnx" -c Release --no-restore

      - name: Tests
        run: dotnet test "tests/DESD.LifeHub.Tests/DESD.LifeHub.Tests.csproj" -c Release --no-build --verbosity normal
